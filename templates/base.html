{% load static %}
{% with brand_asset='branding/open-book.svg' %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" sizes="any" href="{% static brand_asset %}">
    <title>{% block title %}Library{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A personal library of books read and movies watched.{% endblock %}">
    <meta name="robots" content="{% block meta_robots %}index, follow{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Library{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A personal library of books read and movies watched.{% endblock %}">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=rd41-release-year">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{% url 'book-list' %}">
        <img class="brand__logo" src="{% static brand_asset %}" width="32" height="32" alt="">
        <span>Library</span>
      </a>
      <nav>
        <a class="github-link" href="https://github.com/nikpopesku/reading" target="_blank" rel="noopener noreferrer" aria-label="View Library on GitHub">
          <svg class="github-link__icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0C3.58 0 0 3.69 0 8.24c0 3.64 2.29 6.73 5.47 7.82.4.08.55-.18.55-.4 0-.2-.01-.85-.01-1.54-2.01.38-2.53-.5-2.69-.95-.09-.23-.48-.95-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.25 1.87.9 2.33.68.07-.54.28-.9.51-1.11-1.78-.21-3.64-.92-3.64-4.07 0-.9.31-1.64.82-2.22-.08-.21-.36-1.05.08-2.19 0 0 .67-.22 2.2.85.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.07 2.2-.85 2.2-.85.44 1.14.16 1.98.08 2.19.51.58.82 1.31.82 2.22 0 3.16-1.87 3.86-3.65 4.07.29.26.54.76.54 1.53 0 1.11-.01 2-.01 2.27 0 .22.15.48.55.4A8.09 8.09 0 0 0 16 8.24C16 3.69 12.42 0 8 0Z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </nav>
    </header>
    <div class="layout">
      <nav class="sidenav" aria-label="Sections">
        {% with section=request.resolver_match.url_name %}
        <a class="sidenav__link {% if section == 'book-list' %}active{% endif %}" href="{% url 'book-list' %}" {% if section == 'book-list' %}aria-current="page"{% endif %}>Reading</a>
        <a class="sidenav__link {% if section == 'movie-list' %}active{% endif %}" href="{% url 'movie-list' %}" {% if section == 'movie-list' %}aria-current="page"{% endif %}>Movies</a>
        {% endwith %}
      </nav>
      <main class="page">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
{% endwith %}
