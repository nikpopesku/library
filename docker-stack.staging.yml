version: "3.9"

services:
  web:
    image: ghcr.io/nikpopesku/library-web:${IMAGE_TAG:-staging}
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: library.a007.bid,reading.a007.bid
      DJANGO_CSRF_TRUSTED_ORIGINS: https://library.a007.bid,https://reading.a007.bid
      DJANGO_SECRET_KEY: /run/secrets/reading_django_secret_key
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - reading_django_secret_key
    networks:
      - default
      - traefik
    volumes:
      - media:/app/media
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik"
        - "traefik.http.services.reading-staging.loadbalancer.server.port=8000"
        - "traefik.http.routers.reading-staging-https.rule=Host(`library.a007.bid`)"
        - "traefik.http.routers.reading-staging-https.entrypoints=websecure"
        - "traefik.http.routers.reading-staging-https.tls=true"
        - "traefik.http.routers.reading-staging-https.tls.certresolver=myresolver"
        - "traefik.http.routers.reading-staging-legacy.rule=Host(`reading.a007.bid`)"
        - "traefik.http.routers.reading-staging-legacy.entrypoints=websecure"
        - "traefik.http.routers.reading-staging-legacy.tls=true"
        - "traefik.http.routers.reading-staging-legacy.tls.certresolver=myresolver"
        - "traefik.http.routers.reading-staging-legacy.middlewares=library-staging-redirect"
        - "traefik.http.middlewares.library-staging-redirect.redirectregex.regex=^https?://reading[.]a007[.]bid(.*)"
        - "traefik.http.middlewares.library-staging-redirect.redirectregex.replacement=https://library.a007.bid$${1}"
        - "traefik.http.middlewares.library-staging-redirect.redirectregex.permanent=true"

networks:
  default:
    driver: overlay
  traefik:
    external: true

volumes:
  media:

secrets:
  reading_django_secret_key:
    external: true
